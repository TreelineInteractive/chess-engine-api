
services:
  stockfish-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockfish-api
    ports:
      - "8000:8000"
    environment:
      # Stockfish Configuration
      - STOCKFISH_PATH=/usr/local/bin/stockfish
      - STOCKFISH_THREADS=2
      - STOCKFISH_HASH_SIZE_MB=256
      - STOCKFISH_SKILL_LEVEL=20
      # Analysis Configuration
      - MAX_DEPTH=25
      - DEFAULT_DEPTH=15
      - MAX_ANALYSIS_TIME_MS=10000
      - MAX_MULTI_PV=5
      # API Configuration
      - API_VERSION=1.0.0
      - API_RATE_LIMIT_PER_MINUTE=100
      - MAX_CONCURRENT_ANALYSES=10
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      # CORS Configuration
      - CORS_ORIGINS=*
      # Logging
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      # Mount app directory for development hot-reload
      - ./app:/app/app:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Development configuration with hot-reload
  stockfish-api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockfish-api-dev
    ports:
      - "8001:8000"
    environment:
      - STOCKFISH_PATH=/usr/local/bin/stockfish
      - STOCKFISH_THREADS=1
      - STOCKFISH_HASH_SIZE_MB=128
      - STOCKFISH_SKILL_LEVEL=20
      - MAX_DEPTH=20
      - DEFAULT_DEPTH=12
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=text
      - CORS_ORIGINS=*
    volumes:
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    profiles:
      - dev
