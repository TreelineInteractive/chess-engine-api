name: Deploy to Production (AWS App Runner)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to deploy (e.g. v1.2.3)'
        required: true

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: chess-engine-api
  APP_RUNNER_SERVICE_NAME: chess-engine-api
  DOMAIN_NAME: engine.chesskings.com

permissions:
  id-token: write   # Required for OIDC
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version info
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"   # e.g., v1.2.3
          fi
          VERSION_PLAIN="${VERSION#v}"     # e.g., 1.2.3
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_plain=$VERSION_PLAIN" >> $GITHUB_OUTPUT
          echo "::notice::Deploying version: $VERSION"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-AppRunner-Prod-Deploy

      - name: Verify AWS credentials
        run: |
          echo "Testing AWS credentials..."
          aws sts get-caller-identity
          echo "✅ Successfully authenticated to AWS (prod account)"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker manifest inspect $ECR_REGISTRY/$ECR_REPOSITORY:latest >/dev/null 2>&1; then
            CACHE_FROM="--cache-from type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          else
            CACHE_FROM=""
          fi

          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            $CACHE_FROM \
            --cache-to type=inline \
            .

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$VERSION" >> $GITHUB_OUTPUT
          echo "::notice::Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION"

      - name: Check if App Runner service exists
        id: check-service
        run: |
          if aws apprunner list-services --region ${{ env.AWS_REGION }} \
              --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE_NAME }}'].ServiceArn" \
              --output text | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            SERVICE_ARN=$(aws apprunner list-services --region ${{ env.AWS_REGION }} \
              --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE_NAME }}'].ServiceArn" \
              --output text)
            echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT
            echo "::notice::Service exists: $SERVICE_ARN"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::Service does not exist, will create new service"
          fi

      - name: Create App Runner service
        if: steps.check-service.outputs.exists == 'false'
        id: create-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VERSION_PLAIN: ${{ steps.version.outputs.version_plain }}
        run: |
          echo "Creating new App Runner service..."

          SERVICE_ARN=$(aws apprunner create-service \
            --service-name ${{ env.APP_RUNNER_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --source-configuration '{
              "ImageRepository": {
                "ImageIdentifier": "'"$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"'",
                "ImageRepositoryType": "ECR",
                "ImageConfiguration": {
                  "Port": "8000",
                  "RuntimeEnvironmentVariables": {
                    "STOCKFISH_PATH": "/usr/local/bin/stockfish",
                    "STOCKFISH_THREADS": "2",
                    "STOCKFISH_HASH_SIZE_MB": "256",
                    "STOCKFISH_SKILL_LEVEL": "20",
                    "MAX_DEPTH": "25",
                    "DEFAULT_DEPTH": "15",
                    "MAX_ANALYSIS_TIME_MS": "10000",
                    "MAX_MULTI_PV": "5",
                    "API_VERSION": "'"$VERSION_PLAIN"'",
                    "API_RATE_LIMIT_PER_MINUTE": "100",
                    "MAX_CONCURRENT_ANALYSES": "10",
                    "HOST": "0.0.0.0",
                    "PORT": "8000",
                    "DEBUG": "false",
                    "CORS_ORIGINS": "*",
                    "LOG_LEVEL": "INFO",
                    "LOG_FORMAT": "json",
                    "AUTH_ENABLED": "${{ secrets.AUTH_ENABLED || 'false' }}",
                    "JWKS_URL": "${{ secrets.JWKS_URL || '' }}",
                    "JWT_AUDIENCE": "${{ secrets.JWT_AUDIENCE || 'authenticated' }}",
                    "JWT_ISSUER": "${{ secrets.JWT_ISSUER || '' }}"
                  }
                }
              },
              "AutoDeploymentsEnabled": false,
              "AuthenticationConfiguration": {
                "AccessRoleArn": "'"${{ secrets.PROD_APP_RUNNER_ACCESS_ROLE_ARN }}"'"
              }
            }' \
            --instance-configuration '{
              "Cpu": "1 vCPU",
              "Memory": "2 GB"
            }' \
            --health-check-configuration '{
              "Protocol": "HTTP",
              "Path": "/api/v1/health",
              "Interval": 10,
              "Timeout": 5,
              "HealthyThreshold": 1,
              "UnhealthyThreshold": 5
            }' \
            --network-configuration '{
              "EgressConfiguration": {
                "EgressType": "DEFAULT"
              }
            }' \
            --tags Key=Environment,Value=production Key=Version,Value=${{ steps.version.outputs.version }} Key=ManagedBy,Value=GitHub \
            --query 'Service.ServiceArn' \
            --output text)

          echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT
          echo "::notice::Created service: $SERVICE_ARN"

      - name: Update App Runner service
        if: steps.check-service.outputs.exists == 'true'
        id: update-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VERSION_PLAIN: ${{ steps.version.outputs.version_plain }}
        run: |
          echo "Updating existing App Runner service..."

          aws apprunner update-service \
            --service-arn ${{ steps.check-service.outputs.service_arn }} \
            --region ${{ env.AWS_REGION }} \
            --source-configuration '{
              "ImageRepository": {
                "ImageIdentifier": "'"$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"'",
                "ImageRepositoryType": "ECR",
                "ImageConfiguration": {
                  "Port": "8000",
                  "RuntimeEnvironmentVariables": {
                    "STOCKFISH_PATH": "/usr/local/bin/stockfish",
                    "STOCKFISH_THREADS": "2",
                    "STOCKFISH_HASH_SIZE_MB": "256",
                    "STOCKFISH_SKILL_LEVEL": "20",
                    "MAX_DEPTH": "25",
                    "DEFAULT_DEPTH": "15",
                    "MAX_ANALYSIS_TIME_MS": "10000",
                    "MAX_MULTI_PV": "5",
                    "API_VERSION": "'"$VERSION_PLAIN"'",
                    "API_RATE_LIMIT_PER_MINUTE": "100",
                    "MAX_CONCURRENT_ANALYSES": "10",
                    "HOST": "0.0.0.0",
                    "PORT": "8000",
                    "DEBUG": "false",
                    "CORS_ORIGINS": "*",
                    "LOG_LEVEL": "INFO",
                    "LOG_FORMAT": "json",
                    "AUTH_ENABLED": "${{ secrets.AUTH_ENABLED || 'false' }}",
                    "JWKS_URL": "${{ secrets.JWKS_URL || '' }}",
                    "JWT_AUDIENCE": "${{ secrets.JWT_AUDIENCE || 'authenticated' }}",
                    "JWT_ISSUER": "${{ secrets.JWT_ISSUER || '' }}"
                  }
                }
              },
              "AutoDeploymentsEnabled": false,
              "AuthenticationConfiguration": {
                "AccessRoleArn": "'"${{ secrets.PROD_APP_RUNNER_ACCESS_ROLE_ARN }}"'"
              }
            }' \
            --instance-configuration '{
              "Cpu": "1 vCPU",
              "Memory": "2 GB"
            }' \
            --health-check-configuration '{
              "Protocol": "HTTP",
              "Path": "/api/v1/health",
              "Interval": 10,
              "Timeout": 5,
              "HealthyThreshold": 1,
              "UnhealthyThreshold": 5
            }'

          echo "::notice::Updated service: ${{ steps.check-service.outputs.service_arn }}"

      - name: Wait for deployment to complete
        run: |
          SERVICE_ARN="${{ steps.create-service.outputs.service_arn || steps.check-service.outputs.service_arn }}"
          echo "Waiting for service to be running..."

          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(aws apprunner describe-service \
              --service-arn "$SERVICE_ARN" \
              --region ${{ env.AWS_REGION }} \
              --query 'Service.Status' \
              --output text)

            echo "Current status: $STATUS (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)"

            if [ "$STATUS" = "RUNNING" ]; then
              echo "::notice::Service is running!"
              break
            elif [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "UPDATE_FAILED" ]; then
              echo "::error::Service deployment failed with status: $STATUS"
              exit 1
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
          done

          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "::error::Timeout waiting for service to be running"
            exit 1
          fi

      - name: Get service URL
        id: get-url
        run: |
          SERVICE_ARN="${{ steps.create-service.outputs.service_arn || steps.check-service.outputs.service_arn }}"
          SERVICE_URL=$(aws apprunner describe-service \
            --service-arn "$SERVICE_ARN" \
            --region ${{ env.AWS_REGION }} \
            --query 'Service.ServiceUrl' \
            --output text)

          echo "url=https://$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "::notice::Service URL: https://$SERVICE_URL"

      - name: Health check
        run: |
          SERVICE_URL="${{ steps.get-url.outputs.url }}"
          echo "Running health check against $SERVICE_URL/api/v1/health"

          MAX_ATTEMPTS=30
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -f -s "$SERVICE_URL/api/v1/health" > /dev/null; then
              echo "::notice::Health check passed!"
              curl -s "$SERVICE_URL/api/v1/health" | jq '.' || true
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS failed, retrying in 10s..."
            sleep 10
          done

          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "::warning::Health check did not pass within timeout period"
          fi

      - name: Deployment summary
        run: |
          SERVICE_ARN="${{ steps.create-service.outputs.service_arn || steps.check-service.outputs.service_arn }}"
          SERVICE_URL="${{ steps.get-url.outputs.url }}"

          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed to AWS App Runner (prod)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`${{ steps.version.outputs.version }}\` 🏷️" >> $GITHUB_STEP_SUMMARY
          echo "- **Service ARN**: \`$SERVICE_ARN\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Service URL**: $SERVICE_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Custom Domain**: https://${{ env.DOMAIN_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ steps.build-image.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Health Check" >> $GITHUB_STEP_SUMMARY
          echo "- $SERVICE_URL/api/v1/health" >> $GITHUB_STEP_SUMMARY
          echo "- https://${{ env.DOMAIN_NAME }}/api/v1/health" >> $GITHUB_STEP_SUMMARY
